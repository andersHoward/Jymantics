<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jymantics</title>
<meta name="description" content="A local-first editor for designing and simulating game economies and other systems.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L22 12 L12 22 L2 12 Z' fill='%235b7cff'/%3E%3Ccircle cx='12' cy='12' r='3.5' fill='white'/%3E%3C/svg%3E">
<style>:root {
  --bg: #0e0f13; --panel: #15161b; --panel2: #1c1e25; --border: #2a2c36; --hover: #23252e;
  --ink: #e9e9ee; --muted: #9a9ba8; --line: #cfd0da; --node-fill: #1b1c23;
  --state: #8ea0ff; --accent: #f5a35c; --sel: #5aa2ff; --flow: #4ade80; --warn: #fbbf24; --bad: #f87171;
  --grid: #262833; --primary: #5b7cff; --primary-ink: #fff;
  --note-shadow: rgba(255, 255, 255, .26); /* dark mode: a light 'reverse' shadow shows against the dark canvas */
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f5f2; --panel: #ffffff; --panel2: #f0f0ec; --border: #dcdcd6; --hover: #ebebe6;
    --ink: #1c1c1f; --muted: #6b6b72; --line: #2a2a2e; --node-fill: #ffffff;
    --state: #4f5fd6; --accent: #c2410c; --sel: #1d6fe0; --flow: #15803d; --warn: #b45309; --bad: #c62828;
    --grid: #dcdcd4; --primary: #3756e6; --note-shadow: rgba(0, 0, 0, .25); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f5f2; --panel: #ffffff; --panel2: #f0f0ec; --border: #dcdcd6; --hover: #ebebe6;
  --ink: #1c1c1f; --muted: #6b6b72; --line: #2a2a2e; --node-fill: #ffffff;
  --state: #4f5fd6; --accent: #c2410c; --sel: #1d6fe0; --flow: #15803d; --warn: #b45309; --bad: #c62828;
  --grid: #dcdcd4; --primary: #3756e6; --note-shadow: rgba(0, 0, 0, .25); color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
button.primary:hover { filter: brightness(1.1); background: var(--primary); }
button.danger { background: var(--bad); border-color: var(--bad); }
button.icon { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; font-size: 16px; }
button.small { padding: 2px 8px; font-size: 12px; }
button.link { background: none; border: 0; padding: 0; color: var(--sel); text-decoration: underline; }
button.active { border-color: var(--sel); color: var(--sel); }
input[type=text], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
kbd { font: 10px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; }
code { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }

#app {
  display: grid; height: 100vh;
  grid-template-columns: 52px minmax(0, 1fr) 300px;
  grid-template-rows: auto 44px auto minmax(0, 1fr) auto;
  grid-template-areas: "title title title" "top top top" "transport transport transport" "tools stage side" "tools run side";
}
.topbar { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 650; color: var(--ink); padding: 4px 11px 4px 8px; margin-right: 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; letter-spacing: .01em; }
.titlebar { grid-area: title; display: flex; align-items: center; gap: 4px; padding: 5px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand svg { color: var(--primary); }
.brand .version { font-weight: 500; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.docfield { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: text; }
.docfield > span { font-size: 12px; white-space: nowrap; }
.docfield svg { color: var(--muted); margin-left: -26px; pointer-events: none; }
.docname { font-weight: 600; width: 230px; padding-right: 26px !important; background: var(--bg) !important; border: 1px solid var(--border) !important; color: var(--ink); }
.docfield:hover .docname { border-color: var(--muted) !important; }
.docname:focus { border-color: var(--sel) !important; }
.dirty { font-size: 11.5px; color: var(--accent); white-space: nowrap; }
.dirty:not(:empty) { padding: 2px 8px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 10px; }
.menu { display: flex; gap: 2px; margin-left: 4px; }
.menu > .dropdown > button { padding: 4px 8px; }
.menu > .dropdown > button { background: transparent; border-color: transparent; }
.menu > .dropdown > button:hover { background: var(--hover); }
.dropdown { position: relative; }
.drop { display: none; position: absolute; top: 32px; left: 0; z-index: 30; min-width: 250px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.drop.open { display: block; }
.drop button { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; padding: 6px 9px; }
.drop button:hover { background: var(--hover); }
.spacer { flex: 1; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
.zoomlabel { min-width: 52px; background: transparent; border-color: transparent; }
.group { display: flex; align-items: center; gap: 2px; padding: 2px; margin-left: 6px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
.group > button { background: transparent; border-color: transparent; height: 28px; }
.group > button:hover:not(:disabled) { background: var(--hover); }

.toolbar { grid-area: tools; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; overflow-y: auto; }
.toolbar hr { width: 30px; }
.tool { position: relative; width: 40px; height: 38px; padding: 0; display: grid; place-items: center; background: transparent; border-color: transparent; color: var(--ink); }
.tool kbd { position: absolute; right: 1px; bottom: 0; border: 0; font-size: 9px; padding: 0; }
.tool.active { background: color-mix(in srgb, var(--sel) 18%, transparent); border-color: var(--sel); color: var(--sel); }

.stage { grid-area: stage; position: relative; overflow: hidden; background: var(--bg); }
.canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; user-select: none; -webkit-user-select: none; touch-action: none; }
.canvas[data-tool=pan], .canvas.panning { cursor: grab; }
.canvas.grabbing { cursor: grabbing; }
.canvas[data-tool=node] { cursor: copy; }
.canvas[data-tool=connect] { cursor: crosshair; }
.grid-dot { fill: var(--grid); }
.empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 380px; padding: 18px 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; pointer-events: auto; z-index: 2; }
.empty h3 { margin: 0 0 6px; }
.empty p { margin: 6px 0; color: var(--muted); }
.toast { position: absolute; left: 50%; top: 12px; translate: -50% 0; max-width: min(520px, 80%); padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,.3); opacity: 0; transform: translateY(6px); transition: .18s; pointer-events: none; z-index: 5; }
.toast.show { opacity: 1; transform: none; }
.toast.warn { border-color: var(--warn); }

/* ---------- diagram */
.shape { fill: var(--node-fill); stroke: var(--line); stroke-width: 2; }
.inner { fill: none; stroke: var(--line); stroke-width: 1.5; }
.bar { stroke: var(--line); stroke-width: 2; fill: none; }
.bar.thin { stroke-width: 1.6; }
.fill-ink { fill: var(--line); }
.die { fill: none; stroke: var(--line); stroke-width: 1.3; }
.pip { fill: var(--line); }
.mark { fill: var(--accent); }
.mark-line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.label { fill: var(--ink); font-size: 13px; }
.value { fill: var(--ink); font-size: 15px; font-weight: 700; pointer-events: none; }
.fx-mark { fill: var(--ink); font: italic 600 30px Georgia, 'Times New Roman', serif; pointer-events: none; }
.text-node { fill: var(--ink); font-size: 13px; }
.hit { fill: transparent; }
.node { cursor: pointer; }
.node.selected .shape { stroke: var(--sel); stroke-width: 3; }
.node.selected .hit { stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 4 3; }
.node.connect-ok .shape { stroke: var(--flow); stroke-width: 3; }
.node.connect-bad .shape { stroke: var(--bad); stroke-dasharray: 4 3; }
/* run-state looks are debug options (Debug tab); each is switched on by a class on <html> */
.dbg-laststep .node.fired .shape { stroke: var(--flow); }
.dbg-queued .node.queued .shape { stroke: var(--accent); stroke-dasharray: 5 3; }
.dbg-disabled .node.disabled { opacity: .45; }
.reg-arrow { cursor: pointer; }
.arrow-btn { fill: var(--muted); }
.reg-arrow:hover .arrow-btn { fill: var(--sel); }
.running .node-pool[data-interactive], .running .node { cursor: default; }

.conn { cursor: pointer; }
.conn .hitline { stroke: transparent; stroke-width: 14; fill: none; }
.conn .line { fill: none; stroke: var(--line); stroke-width: 2; }
.conn.state .line { stroke: var(--state); stroke-dasharray: 6 5; }
.conn .ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 6; opacity: .55; }
.conn .formula { fill: var(--ink); font-size: 10px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.conn .formula-why { fill: var(--muted); font-weight: 500; }
.conn.state .formula { fill: var(--state); }
.conn .trigger-mark { fill: var(--state); stroke: var(--bg); stroke-width: 1; }
.portal-dot { fill: var(--node-fill); stroke: var(--conn-ink, var(--line)); stroke-width: 1.2; }
.portal-tag { fill: var(--conn-ink, var(--line)); font-size: 6.5px; font-weight: 400; }
.conn.selected .line { stroke: var(--sel); stroke-width: 3; }
.conn.connect-ok .line { stroke: var(--flow); stroke-width: 3; }
.conn:hover .line { stroke-width: 3; }
.dbg-laststep .conn.flow .line { stroke: var(--flow); stroke-width: 3; }
/* a resource connection waiting for resources (e.g. a converter that can't get a full set): greyed out,
   flashing three times, pausing, and again, for as long as it waits. Same solid line, so it never looks like a state connection. */
.dbg-short .conn.short .line { stroke: var(--muted); }
.dbg-short .conn.short .formula { fill: var(--muted); }
.dbg-short .conn.short { animation: short-flash 2.4s linear infinite; }
@keyframes short-flash {
  0%, 12%, 24%, 36%, 100% { opacity: .35; }
  6%, 18%, 30% { opacity: .9; }
}
@media (prefers-reduced-motion: reduce) { .dbg-short .conn.short { animation: none; opacity: .45; } }
.dbg-laststep .conn.trig .line { stroke: var(--accent); }
.flowtag { fill: var(--flow); font-size: 11px; font-weight: 700; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.conn.short .flowtag { display: none; }
:root:not(.dbg-laststep) .flowtag { display: none; }
.arrow-r { fill: var(--line); } .arrow-s { fill: var(--state); } .arrow-sel { fill: var(--sel); } .arrow-tune { fill: #ff2020; }
.handle { fill: var(--panel); stroke: var(--sel); stroke-width: 2; cursor: move; }
.handle.add { fill: var(--sel); stroke: var(--panel); stroke-width: 1.5; opacity: .75; cursor: copy; }
.handle.add:hover { opacity: 1; }
.marquee { fill: color-mix(in srgb, var(--sel) 12%, transparent); stroke: var(--sel); stroke-dasharray: 4 3; }
.rubber { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 3; pointer-events: none; }
.rubber.state { stroke: var(--state); }
.token circle { fill: var(--flow); stroke: var(--bg); stroke-width: 2; }
.token text { fill: #06210f; font-size: 9px; font-weight: 800; }
.inline-edit { position: absolute; z-index: 10; transform: translate(-50%, -50%); min-width: 90px; text-align: center; padding: 3px 6px; border: 2px solid var(--sel) !important; border-radius: 5px; background: var(--panel) !important; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.inline-edit.formula { font-family: var(--mono); }

/* ---------- side panel */
.side { grid-area: side; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 6px; gap: 2px; flex: none; }
.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 9px 7px; color: var(--muted); }
.tab:hover { background: transparent !important; color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--sel); }
.count { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: #111; font-size: 10px; font-weight: 700; text-align: center; }
.count:empty { display: none; }
.panel { display: none; overflow-y: auto; padding: 10px 14px 20px; flex: 1; min-height: 0; }
.panel.active { display: block; }
.panel h2 { font-size: 14px; margin: 6px 0 4px; }
.id-line { font: 11px var(--mono); color: var(--muted); margin-bottom: 8px; }
.field { display: grid; gap: 3px; margin: 9px 0; }
.field > span { color: var(--muted); font-size: 12px; }
.field.check { grid-template-columns: auto 1fr; align-items: center; gap: 7px; }
.field.check > span { color: var(--ink); font-size: 13px; }
.hint { color: var(--muted); font-size: 11.5px; grid-column: 1 / -1; }
.hint.bad { color: var(--bad); }
.vars { display: grid; gap: 5px; margin: 6px 0; }
.var-row { display: grid; grid-template-columns: minmax(0, 1fr) 50px 26px 22px; gap: 4px; align-items: center; }
.var-row > .tune { grid-column: 3; } .var-row > button { grid-column: 4; padding-left: 0; padding-right: 0; }
.var-row > input:first-child { padding-left: 6px; padding-right: 4px; }
.var-head { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.var-head span:nth-child(3) { text-align: center; }
.var-row.is-formula .vv { grid-column: 1 / -1; grid-row: 2; }
.var-row input { min-width: 0; font-family: var(--mono); font-size: 12px; }
.issue { display: block; width: 100%; text-align: left; white-space: normal; margin: 5px 0; padding: 7px 9px; border-left: 3px solid var(--warn); }
.issue.error { border-left-color: var(--bad); }
.log { font-size: 12px; }
.debug-opts { list-style: none; margin: 8px 0 0; padding: 0; }
.debug-opts li { padding: 6px 0; border-bottom: 1px solid var(--border); }
.debug-opts label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-weight: 600; }
.debug-opts input { margin-top: 2px; }
.debug-opts .hint { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.log-step { padding: 6px 0; border-bottom: 1px solid var(--border); }
.log-step b { display: block; margin-bottom: 2px; }
.log-step .warn { color: var(--warn); }

/* ---------- run bar and dock */
.runbar { grid-area: run; background: var(--panel); min-width: 0; }
.transport { grid-area: transport; background: var(--panel2); border-bottom: 1px solid var(--border); }
.runcontrols { display: flex; align-items: center; gap: 6px; padding: 6px 10px; flex-wrap: wrap; }
.speed, .runs { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.speed select { width: 64px; }
.runs input { width: 64px; }
.stepno { font-variant-numeric: tabular-nums; min-width: 92px; font-weight: 600; }
/* speed + step counter share one container, set apart from the buttons and predictions */
.runstate { gap: 10px; padding: 2px 10px 2px 10px; background: var(--bg); }
.runstate .speed select { height: 26px; }
.runstate .stepno { min-width: 64px; }
.dock { display: none; height: 230px; border-top: 1px solid var(--border); flex-direction: column; }
.dock-open .runbar { border-top: 1px solid var(--border); }
.dock-open .dock { display: flex; }
.dockpanel { display: none; flex: 1; overflow: auto; padding: 8px 12px; min-height: 0; }
.dockpanel.active { display: block; }
.chart .gridline { stroke: var(--border); }
.chart .axis { fill: var(--muted); font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.stats { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stats th, .stats td { padding: 3px 12px 3px 0; text-align: right; border-bottom: 1px solid var(--border); }
.stats th:first-child, .stats td:first-child { text-align: left; }

/* ---------- modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; }
.modal[hidden] { display: none; }
.sheet { width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.sheet h2 { margin: 0 0 8px; font-size: 17px; }
.sheet textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; }
.sheet .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.sheet .error { color: var(--bad); min-height: 1em; }
.help { border-collapse: collapse; }
.help th { text-align: left; vertical-align: top; padding: 5px 14px 5px 0; white-space: nowrap; }
.help td { padding: 5px 0; color: var(--muted); }

@media (max-width: 900px) {
  #app { grid-template-columns: 46px minmax(0, 1fr); grid-template-areas: "title title" "top top" "transport transport" "tools stage" "tools run"; }
  .side { display: none; }
  .docfield > span { display: none; }
}

/* ---------- play-only canvas and the exported player */
.canvas.readonly { cursor: grab; }
.canvas.readonly .node, .canvas.readonly .conn { cursor: grab; }
.canvas.readonly .node.mode-interactive { cursor: pointer; }
.canvas.readonly .node.mode-interactive:hover .shape { stroke: var(--sel); }
#app.player { grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr) 280px; grid-template-areas: "title title" "transport transport" "stage side" "run side"; }
#app.player.no-side { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "transport" "stage" "run"; }
#app.player.no-side .side { display: none; }
.player-title { font-weight: 650; font-size: 14px; margin-left: 10px; }
.player-badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; margin-left: 8px; }
.tunable { display: grid; gap: 4px; margin: 12px 0; }
.tunable .row { display: flex; align-items: center; gap: 8px; }
.tunable label { font-weight: 600; font-family: var(--mono); font-size: 12.5px; }
.tunable input[type=number] { width: 84px; }
.tunable input[type=range] { flex: 1; min-width: 0; }
.tunable .changed { color: var(--accent); font-size: 11px; }
.desc { color: var(--muted); white-space: pre-wrap; }
.var-row .tune { display: flex; align-items: center; justify-content: center; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; }
.tbtn .ticon { flex: none; }
.tooltip { position: fixed; z-index: 60; max-width: 260px; padding: 7px 10px; background: var(--panel); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 12px; line-height: 1.4; pointer-events: none; opacity: 0; transform: translateX(-4px); transition: opacity .12s, transform .12s; }
.tooltip.show { opacity: 1; transform: none; transition-delay: .25s; }
.tooltip div { color: var(--muted); margin-top: 3px; }

/* ---------- notes, shapes, frames */
.anno-fo { overflow: visible; pointer-events: none; }
.anno-text.text-box { color: var(--ink); overflow: visible; }
.anno-text.text-box.hug { white-space: pre; }
.anno-text { width: 100%; height: 100%; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.35 var(--font); }
.note-paper { fill: color-mix(in srgb, var(--anno) 78%, #fff); stroke: color-mix(in srgb, var(--anno) 70%, #000); stroke-width: 1; }
.note-shadow { fill: var(--note-shadow); filter: blur(1.5px); }
.note-text { color: #1f1a05; }
.shape-body { fill: color-mix(in srgb, var(--anno) 18%, var(--bg)); stroke: var(--anno); stroke-width: 2; }
.shape-text { color: var(--ink); display: flex; align-items: center; justify-content: center; text-align: center; }
.frame-body { fill: color-mix(in srgb, var(--anno) 7%, transparent); stroke: none; pointer-events: none; }
.frame-edge { fill: none; stroke: color-mix(in srgb, var(--anno) 55%, transparent); stroke-width: 1.5; stroke-dasharray: 6 4; pointer-events: stroke; }
.frame-title { fill: color-mix(in srgb, var(--anno) 60%, var(--ink)); font-size: 14px; font-weight: 650; pointer-events: none; }
.frame-title-hit { fill: transparent; }
.node-frame .frame-edge:hover { stroke-width: 3; }
.node.selected .anno-shape { stroke: var(--sel); stroke-width: 3; stroke-dasharray: none; }
.node-frame.selected .frame-title { fill: var(--sel); }
.handle.resize { fill: var(--panel); stroke: var(--sel); stroke-width: 2; }
.handle.resize[data-corner=nw], .handle.resize[data-corner=se] { cursor: nwse-resize; }
.handle.resize[data-corner=ne], .handle.resize[data-corner=sw] { cursor: nesw-resize; }
.anno-edit { position: absolute; z-index: 10; resize: none; padding: 8px 10px; border: 2px solid var(--sel) !important; border-radius: 4px; font: 13px/1.35 var(--font); background: var(--panel) !important; color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.35); transform-origin: 0 0; }
.color-row { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
.swatch.on { border-color: var(--ink); }
.swatch.auto { background: linear-gradient(135deg, #fff 50%, #111 50%) !important; }
.segment { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: max-content; }
.segment button { border: 0; border-radius: 0; background: transparent; padding: 3px 10px; }
.segment button + button { border-left: 1px solid var(--border); }
.segment button.on { background: color-mix(in srgb, var(--sel) 22%, transparent); color: var(--ink); }
.field textarea { width: 100%; font: 13px/1.35 var(--font); resize: vertical; }
.node-bubble { pointer-events: none; }
.node-bubble.truncated { pointer-events: auto; cursor: pointer; }
.node-bubble .bubble-full { display: none; }
.node-bubble.open .bubble-full { display: inline; }
.node-bubble.open .bubble-short { display: none; }
.node-bubble.truncated:hover .bubble-shape { stroke: var(--sel); }
.bubble-shape { fill: var(--panel); stroke: var(--border); stroke-width: 1; stroke-linejoin: round; }
.bubble-text { fill: var(--ink); font-size: 11px; }
.comment-body { fill: color-mix(in srgb, var(--anno) var(--body-alpha, 17%), transparent); pointer-events: none; }
.comment-edge { fill: none; stroke: color-mix(in srgb, var(--anno) 70%, transparent); stroke-width: 1.5; pointer-events: stroke; }
.node-comment .comment-edge:hover { stroke-width: 3; }
.comment-header { fill: color-mix(in srgb, var(--anno) 72%, var(--bg)); cursor: move; }
.comment-text { color: #fff; display: flex; align-items: center; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.node-comment.selected .comment-header { stroke: var(--sel); stroke-width: 2; }
.var-row.is-formula > input:first-child { grid-column: 1 / 4; }

/* "More info" links and their tooltip */
.more-info { white-space: nowrap; margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--sel); text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; text-transform: none; letter-spacing: 0; }
.more-info:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; border-radius: 2px; }
.info-tip { position: fixed; z-index: 1000; display: none; max-width: 280px; padding: 8px 10px; border-radius: 6px; background: var(--panel2); color: var(--ink); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,.35); font-size: 12px; line-height: 1.45; white-space: pre-wrap; pointer-events: none; }

/* the end condition that stopped the run: pure bright red, blinking */
.node.end-hit .shape, .node.end-hit rect { stroke: #ff0000 !important; }
.node.end-hit .fill-ink { fill: #ff0000 !important; }
.node.end-hit .label { fill: #ff0000 !important; font-weight: 700; }
.node.end-hit { animation: end-blink 0.9s steps(2, jump-none) infinite; }
@keyframes end-blink { from { opacity: 1; } to { opacity: 0.2; } }
@media (prefers-reduced-motion: reduce) { .node.end-hit { animation: none; } }

/* File → Open recent */
.recent:empty { display: none; }
.recent { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 4px 0; padding: 4px 0; }
.drop-label { padding: 4px 9px 2px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.drop .recent-item { align-items: baseline; }
.recent-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.recent-when { flex: none; font-size: 11px; color: var(--muted); }
.drop .recent-clear { color: var(--muted); font-size: 12px; }

/* live link to Claude (title bar chip) */
.linkchip { font-size: 12px; padding: 3px 10px 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.linkchip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.linkchip.linked { color: var(--ink); }
.linkchip.linked::before { background: var(--flow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--flow) 25%, transparent); }
.linkchip.waiting::before { background: var(--warn); }
.linkchip[hidden] { display: none; }

/* tuning highlight: what a tunable value affects. Blinks after a change, steady while hovered. */
.node.tune-blink .shape, .node.tune-blink rect, .node.tune-steady .shape, .node.tune-steady rect { stroke: #ff2020 !important; stroke-width: 3px; }
.node.tune-blink .label, .node.tune-steady .label { fill: #ff2020 !important; font-weight: 700; }
.conn.tune-blink .line, .conn.tune-steady .line { stroke: #ff2020 !important; stroke-width: 3.5px; }
/* a portal's stubs (the small lettered circles) always take the colour their line has right now */
.conn { --conn-ink: var(--line); }
.conn.state { --conn-ink: var(--state); }
.conn.selected { --conn-ink: var(--sel); }
.conn.connect-ok { --conn-ink: var(--flow); }
.dbg-laststep .conn.flow { --conn-ink: var(--flow); }
.dbg-short .conn.short { --conn-ink: var(--muted); }
.dbg-laststep .conn.trig { --conn-ink: var(--accent); }
.conn.tune-blink, .conn.tune-steady { --conn-ink: #ff2020; }
.conn.tune-blink .formula, .conn.tune-steady .formula { fill: #ff2020 !important; }
.node.tune-blink, .conn.tune-blink { animation: tune-blink 0.5s steps(2, jump-none) infinite; }
@keyframes tune-blink { from { opacity: 1; } to { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .node.tune-blink, .conn.tune-blink { animation: none; } }

/* resource types: icons, the picker, the Resource types section and its dialog */
.res-icon, .res-badge { fill: var(--ink); color: var(--ink); --icon-cut: var(--node-fill); pointer-events: none; }
.res-badge { opacity: .92; }
/* a selected node's resource badge turns the selection blue with it (emoji and picture icons get a blue outline) */
.node.selected .res-badge { fill: var(--sel) !important; color: var(--sel) !important; opacity: 1; }
.node.selected .res-badge:has(text, image) { filter: drop-shadow(0 0 1px var(--sel)) drop-shadow(0 0 1px var(--sel)) drop-shadow(0 0 1px var(--sel)); }
.res-icon-html { display: inline-grid; place-items: center; flex: none; color: var(--ink); --icon-cut: var(--panel); line-height: 1; }
.res-icon-html.res-icon-none { border: 1px dashed var(--border); border-radius: 4px; }
.res-icon-html img { display: block; }
.token .token-bg { fill: var(--flow); stroke: var(--bg); stroke-width: 2; }
.token .token-icon { fill: var(--ink); color: var(--ink); --icon-cut: var(--bg); filter: drop-shadow(0 0 1px var(--bg)) drop-shadow(0 0 1px var(--bg)); }
.token.rejected .token-icon { filter: drop-shadow(0 0 1.5px var(--bad)) drop-shadow(0 0 1px var(--bad)); }
.token .token-count { fill: var(--ink); font-size: 10px; font-weight: 800; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.res-pick { display: flex; align-items: center; gap: 6px; }
.res-pick select { flex: 1; min-width: 0; }
.res-pick-icon { width: 22px; display: inline-grid; place-items: center; }
.res-list { display: grid; gap: 5px; margin: 6px 0; }
.res-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 48px 50px 24px; gap: 4px; align-items: center; }
.res-icon-btn { width: 30px; height: 28px; padding: 0; display: grid; place-items: center; }
.res-default-tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 0 5px; text-align: center; }
.res-uses { white-space: nowrap; }
.res-modal .sheet { width: min(520px, calc(100vw - 32px)); }
.res-top { display: flex; gap: 14px; align-items: flex-end; }
.res-top .field { flex: 1; margin: 0; }
.res-preview { width: 56px; height: 56px; border: 1px solid var(--border); border-radius: 10px; display: grid; place-items: center; background: var(--panel2); }
.sheet h3 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 5px; }
.icon-cell { height: 40px; padding: 0; display: grid; place-items: center; }
.icon-cell.on { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel) inset; }
.res-more { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; flex-wrap: wrap; }
.res-more .field { margin: 0; width: 120px; }
.sheet .pre { white-space: pre-wrap; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.res-more .field input { width: 100%; box-sizing: border-box; }
/* colour resource types */
.res-dot { display: inline-block; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--ink) 35%, transparent); }
.res-dot-svg { stroke: var(--bg); stroke-width: 1.5; }
.res-builtin { display: grid; place-items: center; height: 28px; }
.res-name { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.res-colored:not(.selected):not(.end-hit) .shape { stroke: var(--res-color); }
.node.res-colored:not(.selected) .inner { stroke: var(--res-color); }

/* auto-link: the loose end of a connection, and its blue (will connect) / red (not allowed) states */
.loose-end { fill: var(--bg); stroke: var(--line); stroke-width: 2; cursor: grab; pointer-events: all; }
.loose-end.state { stroke: var(--state); }
.loose-end.selected { stroke: var(--sel); }
.loose-end.dragging { pointer-events: none; cursor: grabbing; }
.loose-end.loose-ok { stroke: var(--sel); fill: color-mix(in srgb, var(--sel) 30%, transparent); stroke-width: 3; r: 14px; }
.loose-end.loose-bad { stroke: var(--bad); fill: color-mix(in srgb, var(--bad) 30%, transparent); stroke-width: 3; r: 14px; }

/* images: the picture, its selection frame, crop mode and the Add image palette */
.image-frame { fill: transparent; stroke: none; }
.node.selected .image-frame { stroke: var(--sel); stroke-width: 2.5; }
.node-image:hover .image-frame { stroke: color-mix(in srgb, var(--sel) 50%, transparent); stroke-width: 1.5; }
.image-missing { fill: var(--panel2); stroke: var(--border); stroke-dasharray: 4 3; }
.image-missing-text { fill: var(--muted); font-size: 11px; }
.crop-ghost { opacity: .32; pointer-events: none; }
.crop-outer { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; pointer-events: none; }
.crop-box { fill: none; stroke: var(--sel); stroke-width: 2; pointer-events: none; }
.crop-handle { fill: var(--bg); stroke: var(--sel); stroke-width: 2; }
.crop-nw, .crop-se { cursor: nwse-resize; } .crop-ne, .crop-sw { cursor: nesw-resize; }
.crop-n, .crop-s { cursor: ns-resize; } .crop-e, .crop-w { cursor: ew-resize; }
.image-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.image-palette { position: fixed; z-index: 60; width: 392px; max-height: min(560px, calc(100vh - 16px)); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 0 16px 48px rgba(0,0,0,.45); }
.image-palette .pal-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.image-palette h4 { margin: 10px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.pal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pal-cell-wrap { position: relative; }
.pal-cell { width: 100%; height: 78px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px; }
.pal-cell img { width: 100%; height: 50px; object-fit: contain; }
.pal-cell span { font-size: 10.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-cell:hover { border-color: var(--sel); }
.pal-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; padding: 0; border-radius: 50%; font-size: 13px; line-height: 1; display: none; }
.pal-cell-wrap:hover .pal-remove { display: block; }
.pal-foot { display: flex; gap: 8px; align-items: center; margin: 12px 0 6px; flex-wrap: wrap; }
/* New / Edit Resource Type dialog */
.sheet h2.dialog-title { margin: -2px -22px 14px; padding: 0 22px 12px; border-bottom: 1px solid var(--border); }
.res-dot.big { width: 34px; height: 34px; }
.icon-colors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.icon-colors.disabled { opacity: .35; pointer-events: none; }
.sheet h3.muted-off { opacity: .45; }
.color-pick { width: 34px; height: 26px; padding: 0 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); cursor: pointer; }

/* the trader's shared middle line */
.node .shape-line { stroke: var(--line); stroke-width: 2; }
.node.selected .shape-line { stroke: var(--sel); stroke-width: 3; }
.node.connect-ok .shape-line { stroke: var(--flow); }

/* pools: chips stacked like poker chips; the number and label take the pool's resource colour */
.chip { stroke-width: 0.8; pointer-events: none; }
.chips { pointer-events: bounding-box; }
.chip-icon { fill: var(--ink); color: var(--ink); --icon-cut: var(--node-fill); pointer-events: none; filter: drop-shadow(0 0 0.6px var(--node-fill)) drop-shadow(0 0 0.6px var(--node-fill)); }
.node-pool.res-colored .value, .node-pool.res-colored .label { fill: var(--res-color); }

/* a token turned away by a pool of another resource type: a quick red flash as it plinks off */
.token.rejected circle:first-child { stroke: var(--bad); stroke-width: 2; }

  --bg: #0e0f13; --panel: #15161b; --panel2: #1c1e25; --border: #2a2c36; --hover: #23252e;
  --ink: #e9e9ee; --muted: #9a9ba8; --line: #cfd0da; --node-fill: #1b1c23;
  --state: #8ea0ff; --accent: #f5a35c; --sel: #5aa2ff; --flow: #4ade80; --warn: #fbbf24; --bad: #f87171;
  --grid: #262833; --primary: #5b7cff; --primary-ink: #fff;
  --note-shadow: rgba(255, 255, 255, .26); /* dark mode: a light 'reverse' shadow shows against the dark canvas */
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f5f2; --panel: #ffffff; --panel2: #f0f0ec; --border: #dcdcd6; --hover: #ebebe6;
    --ink: #1c1c1f; --muted: #6b6b72; --line: #2a2a2e; --node-fill: #ffffff;
    --state: #4f5fd6; --accent: #c2410c; --sel: #1d6fe0; --flow: #15803d; --warn: #b45309; --bad: #c62828;
    --grid: #dcdcd4; --primary: #3756e6; --note-shadow: rgba(0, 0, 0, .25); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f5f2; --panel: #ffffff; --panel2: #f0f0ec; --border: #dcdcd6; --hover: #ebebe6;
  --ink: #1c1c1f; --muted: #6b6b72; --line: #2a2a2e; --node-fill: #ffffff;
  --state: #4f5fd6; --accent: #c2410c; --sel: #1d6fe0; --flow: #15803d; --warn: #b45309; --bad: #c62828;
  --grid: #dcdcd4; --primary: #3756e6; --note-shadow: rgba(0, 0, 0, .25); color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
button.primary:hover { filter: brightness(1.1); background: var(--primary); }
button.danger { background: var(--bad); border-color: var(--bad); }
button.icon { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; font-size: 16px; }
button.small { padding: 2px 8px; font-size: 12px; }
button.link { background: none; border: 0; padding: 0; color: var(--sel); text-decoration: underline; }
button.active { border-color: var(--sel); color: var(--sel); }
input[type=text], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
kbd { font: 10px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; }
code { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }

#app {
  display: grid; height: 100vh;
  grid-template-columns: 52px minmax(0, 1fr) 300px;
  grid-template-rows: auto 44px auto minmax(0, 1fr) auto;
  grid-template-areas: "title title title" "top top top" "transport transport transport" "tools stage side" "tools run side";
}
.topbar { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 650; color: var(--ink); padding: 4px 11px 4px 8px; margin-right: 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; letter-spacing: .01em; }
.titlebar { grid-area: title; display: flex; align-items: center; gap: 4px; padding: 5px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand svg { color: var(--primary); }
.brand .version { font-weight: 500; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.docfield { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: text; }
.docfield > span { font-size: 12px; white-space: nowrap; }
.docfield svg { color: var(--muted); margin-left: -26px; pointer-events: none; }
.docname { font-weight: 600; width: 230px; padding-right: 26px !important; background: var(--bg) !important; border: 1px solid var(--border) !important; color: var(--ink); }
.docfield:hover .docname { border-color: var(--muted) !important; }
.docname:focus { border-color: var(--sel) !important; }
.dirty { font-size: 11.5px; color: var(--accent); white-space: nowrap; }
.dirty:not(:empty) { padding: 2px 8px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 10px; }
.menu { display: flex; gap: 2px; margin-left: 4px; }
.menu > .dropdown > button { padding: 4px 8px; }
.menu > .dropdown > button { background: transparent; border-color: transparent; }
.menu > .dropdown > button:hover { background: var(--hover); }
.dropdown { position: relative; }
.drop { display: none; position: absolute; top: 32px; left: 0; z-index: 30; min-width: 250px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.drop.open { display: block; }
.drop button { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; padding: 6px 9px; }
.drop button:hover { background: var(--hover); }
.spacer { flex: 1; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
.zoomlabel { min-width: 52px; background: transparent; border-color: transparent; }
.group { display: flex; align-items: center; gap: 2px; padding: 2px; margin-left: 6px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
.group > button { background: transparent; border-color: transparent; height: 28px; }
.group > button:hover:not(:disabled) { background: var(--hover); }

.toolbar { grid-area: tools; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; overflow-y: auto; }
.toolbar hr { width: 30px; }
.tool { position: relative; width: 40px; height: 38px; padding: 0; display: grid; place-items: center; background: transparent; border-color: transparent; color: var(--ink); }
.tool kbd { position: absolute; right: 1px; bottom: 0; border: 0; font-size: 9px; padding: 0; }
.tool.active { background: color-mix(in srgb, var(--sel) 18%, transparent); border-color: var(--sel); color: var(--sel); }

.stage { grid-area: stage; position: relative; overflow: hidden; background: var(--bg); }
.canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; user-select: none; -webkit-user-select: none; touch-action: none; }
.canvas[data-tool=pan], .canvas.panning { cursor: grab; }
.canvas.grabbing { cursor: grabbing; }
.canvas[data-tool=node] { cursor: copy; }
.canvas[data-tool=connect] { cursor: crosshair; }
.grid-dot { fill: var(--grid); }
.empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 380px; padding: 18px 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; pointer-events: auto; z-index: 2; }
.empty h3 { margin: 0 0 6px; }
.empty p { margin: 6px 0; color: var(--muted); }
.toast { position: absolute; left: 50%; top: 12px; translate: -50% 0; max-width: min(520px, 80%); padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,.3); opacity: 0; transform: translateY(6px); transition: .18s; pointer-events: none; z-index: 5; }
.toast.show { opacity: 1; transform: none; }
.toast.warn { border-color: var(--warn); }

/* ---------- diagram */
.shape { fill: var(--node-fill); stroke: var(--line); stroke-width: 2; }
.inner { fill: none; stroke: var(--line); stroke-width: 1.5; }
.bar { stroke: var(--line); stroke-width: 2; fill: none; }
.bar.thin { stroke-width: 1.6; }
.fill-ink { fill: var(--line); }
.die { fill: none; stroke: var(--line); stroke-width: 1.3; }
.pip { fill: var(--line); }
.mark { fill: var(--accent); }
.mark-line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.label { fill: var(--ink); font-size: 13px; }
.value { fill: var(--ink); font-size: 15px; font-weight: 700; pointer-events: none; }
.fx-mark { fill: var(--ink); font: italic 600 30px Georgia, 'Times New Roman', serif; pointer-events: none; }
.text-node { fill: var(--ink); font-size: 13px; }
.hit { fill: transparent; }
.node { cursor: pointer; }
.node.selected .shape { stroke: var(--sel); stroke-width: 3; }
.node.selected .hit { stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 4 3; }
.node.connect-ok .shape { stroke: var(--flow); stroke-width: 3; }
.node.connect-bad .shape { stroke: var(--bad); stroke-dasharray: 4 3; }
/* run-state looks are debug options (Debug tab); each is switched on by a class on <html> */
.dbg-laststep .node.fired .shape { stroke: var(--flow); }
.dbg-queued .node.queued .shape { stroke: var(--accent); stroke-dasharray: 5 3; }
.dbg-disabled .node.disabled { opacity: .45; }
.reg-arrow { cursor: pointer; }
.arrow-btn { fill: var(--muted); }
.reg-arrow:hover .arrow-btn { fill: var(--sel); }
.running .node-pool[data-interactive], .running .node { cursor: default; }

.conn { cursor: pointer; }
.conn .hitline { stroke: transparent; stroke-width: 14; fill: none; }
.conn .line { fill: none; stroke: var(--line); stroke-width: 2; }
.conn.state .line { stroke: var(--state); stroke-dasharray: 6 5; }
.conn .ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 6; opacity: .55; }
.conn .formula { fill: var(--ink); font-size: 10px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.conn .formula-why { fill: var(--muted); font-weight: 500; }
.conn.state .formula { fill: var(--state); }
.conn .trigger-mark { fill: var(--state); stroke: var(--bg); stroke-width: 1; }
.portal-dot { fill: var(--node-fill); stroke: var(--conn-ink, var(--line)); stroke-width: 1.2; }
.portal-tag { fill: var(--conn-ink, var(--line)); font-size: 6.5px; font-weight: 400; }
.conn.selected .line { stroke: var(--sel); stroke-width: 3; }
.conn.connect-ok .line { stroke: var(--flow); stroke-width: 3; }
.conn:hover .line { stroke-width: 3; }
.dbg-laststep .conn.flow .line { stroke: var(--flow); stroke-width: 3; }
/* a resource connection waiting for resources (e.g. a converter that can't get a full set): greyed out,
   flashing three times, pausing, and again, for as long as it waits. Same solid line, so it never looks like a state connection. */
.dbg-short .conn.short .line { stroke: var(--muted); }
.dbg-short .conn.short .formula { fill: var(--muted); }
.dbg-short .conn.short { animation: short-flash 2.4s linear infinite; }
@keyframes short-flash {
  0%, 12%, 24%, 36%, 100% { opacity: .35; }
  6%, 18%, 30% { opacity: .9; }
}
@media (prefers-reduced-motion: reduce) { .dbg-short .conn.short { animation: none; opacity: .45; } }
.dbg-laststep .conn.trig .line { stroke: var(--accent); }
.flowtag { fill: var(--flow); font-size: 11px; font-weight: 700; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.conn.short .flowtag { display: none; }
:root:not(.dbg-laststep) .flowtag { display: none; }
.arrow-r { fill: var(--line); } .arrow-s { fill: var(--state); } .arrow-sel { fill: var(--sel); } .arrow-tune { fill: #ff2020; }
.handle { fill: var(--panel); stroke: var(--sel); stroke-width: 2; cursor: move; }
.handle.add { fill: var(--sel); stroke: var(--panel); stroke-width: 1.5; opacity: .75; cursor: copy; }
.handle.add:hover { opacity: 1; }
.marquee { fill: color-mix(in srgb, var(--sel) 12%, transparent); stroke: var(--sel); stroke-dasharray: 4 3; }
.rubber { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 3; pointer-events: none; }
.rubber.state { stroke: var(--state); }
.token circle { fill: var(--flow); stroke: var(--bg); stroke-width: 2; }
.token text { fill: #06210f; font-size: 9px; font-weight: 800; }
.inline-edit { position: absolute; z-index: 10; transform: translate(-50%, -50%); min-width: 90px; text-align: center; padding: 3px 6px; border: 2px solid var(--sel) !important; border-radius: 5px; background: var(--panel) !important; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.inline-edit.formula { font-family: var(--mono); }

/* ---------- side panel */
.side { grid-area: side; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 6px; gap: 2px; flex: none; }
.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 9px 7px; color: var(--muted); }
.tab:hover { background: transparent !important; color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--sel); }
.count { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: #111; font-size: 10px; font-weight: 700; text-align: center; }
.count:empty { display: none; }
.panel { display: none; overflow-y: auto; padding: 10px 14px 20px; flex: 1; min-height: 0; }
.panel.active { display: block; }
.panel h2 { font-size: 14px; margin: 6px 0 4px; }
.id-line { font: 11px var(--mono); color: var(--muted); margin-bottom: 8px; }
.field { display: grid; gap: 3px; margin: 9px 0; }
.field > span { color: var(--muted); font-size: 12px; }
.field.check { grid-template-columns: auto 1fr; align-items: center; gap: 7px; }
.field.check > span { color: var(--ink); font-size: 13px; }
.hint { color: var(--muted); font-size: 11.5px; grid-column: 1 / -1; }
.hint.bad { color: var(--bad); }
.vars { display: grid; gap: 5px; margin: 6px 0; }
.var-row { display: grid; grid-template-columns: minmax(0, 1fr) 50px 26px 22px; gap: 4px; align-items: center; }
.var-row > .tune { grid-column: 3; } .var-row > button { grid-column: 4; padding-left: 0; padding-right: 0; }
.var-row > input:first-child { padding-left: 6px; padding-right: 4px; }
.var-head { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.var-head span:nth-child(3) { text-align: center; }
.var-row.is-formula .vv { grid-column: 1 / -1; grid-row: 2; }
.var-row input { min-width: 0; font-family: var(--mono); font-size: 12px; }
.issue { display: block; width: 100%; text-align: left; white-space: normal; margin: 5px 0; padding: 7px 9px; border-left: 3px solid var(--warn); }
.issue.error { border-left-color: var(--bad); }
.log { font-size: 12px; }
.debug-opts { list-style: none; margin: 8px 0 0; padding: 0; }
.debug-opts li { padding: 6px 0; border-bottom: 1px solid var(--border); }
.debug-opts label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-weight: 600; }
.debug-opts input { margin-top: 2px; }
.debug-opts .hint { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.log-step { padding: 6px 0; border-bottom: 1px solid var(--border); }
.log-step b { display: block; margin-bottom: 2px; }
.log-step .warn { color: var(--warn); }

/* ---------- run bar and dock */
.runbar { grid-area: run; background: var(--panel); min-width: 0; }
.transport { grid-area: transport; background: var(--panel2); border-bottom: 1px solid var(--border); }
.runcontrols { display: flex; align-items: center; gap: 6px; padding: 6px 10px; flex-wrap: wrap; }
.speed, .runs { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.speed select { width: 64px; }
.runs input { width: 64px; }
.stepno { font-variant-numeric: tabular-nums; min-width: 92px; font-weight: 600; }
/* speed + step counter share one container, set apart from the buttons and predictions */
.runstate { gap: 10px; padding: 2px 10px 2px 10px; background: var(--bg); }
.runstate .speed select { height: 26px; }
.runstate .stepno { min-width: 64px; }
.dock { display: none; height: 230px; border-top: 1px solid var(--border); flex-direction: column; }
.dock-open .runbar { border-top: 1px solid var(--border); }
.dock-open .dock { display: flex; }
.dockpanel { display: none; flex: 1; overflow: auto; padding: 8px 12px; min-height: 0; }
.dockpanel.active { display: block; }
.chart .gridline { stroke: var(--border); }
.chart .axis { fill: var(--muted); font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.stats { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stats th, .stats td { padding: 3px 12px 3px 0; text-align: right; border-bottom: 1px solid var(--border); }
.stats th:first-child, .stats td:first-child { text-align: left; }

/* ---------- modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; }
.modal[hidden] { display: none; }
.sheet { width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.sheet h2 { margin: 0 0 8px; font-size: 17px; }
.sheet textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; }
.sheet .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.sheet .error { color: var(--bad); min-height: 1em; }
.help { border-collapse: collapse; }
.help th { text-align: left; vertical-align: top; padding: 5px 14px 5px 0; white-space: nowrap; }
.help td { padding: 5px 0; color: var(--muted); }

@media (max-width: 900px) {
  #app { grid-template-columns: 46px minmax(0, 1fr); grid-template-areas: "title title" "top top" "transport transport" "tools stage" "tools run"; }
  .side { display: none; }
  .docfield > span { display: none; }
}

/* ---------- play-only canvas and the exported player */
.canvas.readonly { cursor: grab; }
.canvas.readonly .node, .canvas.readonly .conn { cursor: grab; }
.canvas.readonly .node.mode-interactive { cursor: pointer; }
.canvas.readonly .node.mode-interactive:hover .shape { stroke: var(--sel); }
#app.player { grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr) 280px; grid-template-areas: "title title" "transport transport" "stage side" "run side"; }
#app.player.no-side { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "transport" "stage" "run"; }
#app.player.no-side .side { display: none; }
.player-title { font-weight: 650; font-size: 14px; margin-left: 10px; }
.player-badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; margin-left: 8px; }
.tunable { display: grid; gap: 4px; margin: 12px 0; }
.tunable .row { display: flex; align-items: center; gap: 8px; }
.tunable label { font-weight: 600; font-family: var(--mono); font-size: 12.5px; }
.tunable input[type=number] { width: 84px; }
.tunable input[type=range] { flex: 1; min-width: 0; }
.tunable .changed { color: var(--accent); font-size: 11px; }
.desc { color: var(--muted); white-space: pre-wrap; }
.var-row .tune { display: flex; align-items: center; justify-content: center; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; }
.tbtn .ticon { flex: none; }
.tooltip { position: fixed; z-index: 60; max-width: 260px; padding: 7px 10px; background: var(--panel); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 12px; line-height: 1.4; pointer-events: none; opacity: 0; transform: translateX(-4px); transition: opacity .12s, transform .12s; }
.tooltip.show { opacity: 1; transform: none; transition-delay: .25s; }
.tooltip div { color: var(--muted); margin-top: 3px; }

/* ---------- notes, shapes, frames */
.anno-fo { overflow: visible; pointer-events: none; }
.anno-text.text-box { color: var(--ink); overflow: visible; }
.anno-text.text-box.hug { white-space: pre; }
.anno-text { width: 100%; height: 100%; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.35 var(--font); }
.note-paper { fill: color-mix(in srgb, var(--anno) 78%, #fff); stroke: color-mix(in srgb, var(--anno) 70%, #000); stroke-width: 1; }
.note-shadow { fill: var(--note-shadow); filter: blur(1.5px); }
.note-text { color: #1f1a05; }
.shape-body { fill: color-mix(in srgb, var(--anno) 18%, var(--bg)); stroke: var(--anno); stroke-width: 2; }
.shape-text { color: var(--ink); display: flex; align-items: center; justify-content: center; text-align: center; }
.frame-body { fill: color-mix(in srgb, var(--anno) 7%, transparent); stroke: none; pointer-events: none; }
.frame-edge { fill: none; stroke: color-mix(in srgb, var(--anno) 55%, transparent); stroke-width: 1.5; stroke-dasharray: 6 4; pointer-events: stroke; }
.frame-title { fill: color-mix(in srgb, var(--anno) 60%, var(--ink)); font-size: 14px; font-weight: 650; pointer-events: none; }
.frame-title-hit { fill: transparent; }
.node-frame .frame-edge:hover { stroke-width: 3; }
.node.selected .anno-shape { stroke: var(--sel); stroke-width: 3; stroke-dasharray: none; }
.node-frame.selected .frame-title { fill: var(--sel); }
.handle.resize { fill: var(--panel); stroke: var(--sel); stroke-width: 2; }
.handle.resize[data-corner=nw], .handle.resize[data-corner=se] { cursor: nwse-resize; }
.handle.resize[data-corner=ne], .handle.resize[data-corner=sw] { cursor: nesw-resize; }
.anno-edit { position: absolute; z-index: 10; resize: none; padding: 8px 10px; border: 2px solid var(--sel) !important; border-radius: 4px; font: 13px/1.35 var(--font); background: var(--panel) !important; color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.35); transform-origin: 0 0; }
.color-row { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
.swatch.on { border-color: var(--ink); }
.swatch.auto { background: linear-gradient(135deg, #fff 50%, #111 50%) !important; }
.segment { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: max-content; }
.segment button { border: 0; border-radius: 0; background: transparent; padding: 3px 10px; }
.segment button + button { border-left: 1px solid var(--border); }
.segment button.on { background: color-mix(in srgb, var(--sel) 22%, transparent); color: var(--ink); }
.field textarea { width: 100%; font: 13px/1.35 var(--font); resize: vertical; }
.node-bubble { pointer-events: none; }
.node-bubble.truncated { pointer-events: auto; cursor: pointer; }
.node-bubble .bubble-full { display: none; }
.node-bubble.open .bubble-full { display: inline; }
.node-bubble.open .bubble-short { display: none; }
.node-bubble.truncated:hover .bubble-shape { stroke: var(--sel); }
.bubble-shape { fill: var(--panel); stroke: var(--border); stroke-width: 1; stroke-linejoin: round; }
.bubble-text { fill: var(--ink); font-size: 11px; }
.comment-body { fill: color-mix(in srgb, var(--anno) var(--body-alpha, 17%), transparent); pointer-events: none; }
.comment-edge { fill: none; stroke: color-mix(in srgb, var(--anno) 70%, transparent); stroke-width: 1.5; pointer-events: stroke; }
.node-comment .comment-edge:hover { stroke-width: 3; }
.comment-header { fill: color-mix(in srgb, var(--anno) 72%, var(--bg)); cursor: move; }
.comment-text { color: #fff; display: flex; align-items: center; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.node-comment.selected .comment-header { stroke: var(--sel); stroke-width: 2; }
.var-row.is-formula > input:first-child { grid-column: 1 / 4; }

/* "More info" links and their tooltip */
.more-info { white-space: nowrap; margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--sel); text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; text-transform: none; letter-spacing: 0; }
.more-info:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; border-radius: 2px; }
.info-tip { position: fixed; z-index: 1000; display: none; max-width: 280px; padding: 8px 10px; border-radius: 6px; background: var(--panel2); color: var(--ink); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,.35); font-size: 12px; line-height: 1.45; white-space: pre-wrap; pointer-events: none; }

/* the end condition that stopped the run: pure bright red, blinking */
.node.end-hit .shape, .node.end-hit rect { stroke: #ff0000 !important; }
.node.end-hit .fill-ink { fill: #ff0000 !important; }
.node.end-hit .label { fill: #ff0000 !important; font-weight: 700; }
.node.end-hit { animation: end-blink 0.9s steps(2, jump-none) infinite; }
@keyframes end-blink { from { opacity: 1; } to { opacity: 0.2; } }
@media (prefers-reduced-motion: reduce) { .node.end-hit { animation: none; } }

/* File → Open recent */
.recent:empty { display: none; }
.recent { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 4px 0; padding: 4px 0; }
.drop-label { padding: 4px 9px 2px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.drop .recent-item { align-items: baseline; }
.recent-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.recent-when { flex: none; font-size: 11px; color: var(--muted); }
.drop .recent-clear { color: var(--muted); font-size: 12px; }

/* live link to Claude (title bar chip) */
.linkchip { font-size: 12px; padding: 3px 10px 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.linkchip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.linkchip.linked { color: var(--ink); }
.linkchip.linked::before { background: var(--flow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--flow) 25%, transparent); }
.linkchip.waiting::before { background: var(--warn); }
.linkchip[hidden] { display: none; }

/* tuning highlight: what a tunable value affects. Blinks after a change, steady while hovered. */
.node.tune-blink .shape, .node.tune-blink rect, .node.tune-steady .shape, .node.tune-steady rect { stroke: #ff2020 !important; stroke-width: 3px; }
.node.tune-blink .label, .node.tune-steady .label { fill: #ff2020 !important; font-weight: 700; }
.conn.tune-blink .line, .conn.tune-steady .line { stroke: #ff2020 !important; stroke-width: 3.5px; }
/* a portal's stubs (the small lettered circles) always take the colour their line has right now */
.conn { --conn-ink: var(--line); }
.conn.state { --conn-ink: var(--state); }
.conn.selected { --conn-ink: var(--sel); }
.conn.connect-ok { --conn-ink: var(--flow); }
.dbg-laststep .conn.flow { --conn-ink: var(--flow); }
.dbg-short .conn.short { --conn-ink: var(--muted); }
.dbg-laststep .conn.trig { --conn-ink: var(--accent); }
.conn.tune-blink, .conn.tune-steady { --conn-ink: #ff2020; }
.conn.tune-blink .formula, .conn.tune-steady .formula { fill: #ff2020 !important; }
.node.tune-blink, .conn.tune-blink { animation: tune-blink 0.5s steps(2, jump-none) infinite; }
@keyframes tune-blink { from { opacity: 1; } to { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .node.tune-blink, .conn.tune-blink { animation: none; } }

/* resource types: icons, the picker, the Resource types section and its dialog */
.res-icon, .res-badge { fill: var(--ink); color: var(--ink); --icon-cut: var(--node-fill); pointer-events: none; }
.res-badge { opacity: .92; }
/* a selected node's resource badge turns the selection blue with it (emoji and picture icons get a blue outline) */
.node.selected .res-badge { fill: var(--sel) !important; color: var(--sel) !important; opacity: 1; }
.node.selected .res-badge:has(text, image) { filter: drop-shadow(0 0 1px var(--sel)) drop-shadow(0 0 1px var(--sel)) drop-shadow(0 0 1px var(--sel)); }
.res-icon-html { display: inline-grid; place-items: center; flex: none; color: var(--ink); --icon-cut: var(--panel); line-height: 1; }
.res-icon-html.res-icon-none { border: 1px dashed var(--border); border-radius: 4px; }
.res-icon-html img { display: block; }
.token .token-bg { fill: var(--flow); stroke: var(--bg); stroke-width: 2; }
.token .token-icon { fill: var(--ink); color: var(--ink); --icon-cut: var(--bg); filter: drop-shadow(0 0 1px var(--bg)) drop-shadow(0 0 1px var(--bg)); }
.token.rejected .token-icon { filter: drop-shadow(0 0 1.5px var(--bad)) drop-shadow(0 0 1px var(--bad)); }
.token .token-count { fill: var(--ink); font-size: 10px; font-weight: 800; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.res-pick { display: flex; align-items: center; gap: 6px; }
.res-pick select { flex: 1; min-width: 0; }
.res-pick-icon { width: 22px; display: inline-grid; place-items: center; }
.res-list { display: grid; gap: 5px; margin: 6px 0; }
.res-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 48px 50px 24px; gap: 4px; align-items: center; }
.res-icon-btn { width: 30px; height: 28px; padding: 0; display: grid; place-items: center; }
.res-default-tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 0 5px; text-align: center; }
.res-uses { white-space: nowrap; }
.res-modal .sheet { width: min(520px, calc(100vw - 32px)); }
.res-top { display: flex; gap: 14px; align-items: flex-end; }
.res-top .field { flex: 1; margin: 0; }
.res-preview { width: 56px; height: 56px; border: 1px solid var(--border); border-radius: 10px; display: grid; place-items: center; background: var(--panel2); }
.sheet h3 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 5px; }
.icon-cell { height: 40px; padding: 0; display: grid; place-items: center; }
.icon-cell.on { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel) inset; }
.res-more { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; flex-wrap: wrap; }
.res-more .field { margin: 0; width: 120px; }
.sheet .pre { white-space: pre-wrap; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.res-more .field input { width: 100%; box-sizing: border-box; }
/* colour resource types */
.res-dot { display: inline-block; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--ink) 35%, transparent); }
.res-dot-svg { stroke: var(--bg); stroke-width: 1.5; }
.res-builtin { display: grid; place-items: center; height: 28px; }
.res-name { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.res-colored:not(.selected):not(.end-hit) .shape { stroke: var(--res-color); }
.node.res-colored:not(.selected) .inner { stroke: var(--res-color); }

/* auto-link: the loose end of a connection, and its blue (will connect) / red (not allowed) states */
.loose-end { fill: var(--bg); stroke: var(--line); stroke-width: 2; cursor: grab; pointer-events: all; }
.loose-end.state { stroke: var(--state); }
.loose-end.selected { stroke: var(--sel); }
.loose-end.dragging { pointer-events: none; cursor: grabbing; }
.loose-end.loose-ok { stroke: var(--sel); fill: color-mix(in srgb, var(--sel) 30%, transparent); stroke-width: 3; r: 14px; }
.loose-end.loose-bad { stroke: var(--bad); fill: color-mix(in srgb, var(--bad) 30%, transparent); stroke-width: 3; r: 14px; }

/* images: the picture, its selection frame, crop mode and the Add image palette */
.image-frame { fill: transparent; stroke: none; }
.node.selected .image-frame { stroke: var(--sel); stroke-width: 2.5; }
.node-image:hover .image-frame { stroke: color-mix(in srgb, var(--sel) 50%, transparent); stroke-width: 1.5; }
.image-missing { fill: var(--panel2); stroke: var(--border); stroke-dasharray: 4 3; }
.image-missing-text { fill: var(--muted); font-size: 11px; }
.crop-ghost { opacity: .32; pointer-events: none; }
.crop-outer { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; pointer-events: none; }
.crop-box { fill: none; stroke: var(--sel); stroke-width: 2; pointer-events: none; }
.crop-handle { fill: var(--bg); stroke: var(--sel); stroke-width: 2; }
.crop-nw, .crop-se { cursor: nwse-resize; } .crop-ne, .crop-sw { cursor: nesw-resize; }
.crop-n, .crop-s { cursor: ns-resize; } .crop-e, .crop-w { cursor: ew-resize; }
.image-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.image-palette { position: fixed; z-index: 60; width: 392px; max-height: min(560px, calc(100vh - 16px)); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 0 16px 48px rgba(0,0,0,.45); }
.image-palette .pal-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.image-palette h4 { margin: 10px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.pal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pal-cell-wrap { position: relative; }
.pal-cell { width: 100%; height: 78px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px; }
.pal-cell img { width: 100%; height: 50px; object-fit: contain; }
.pal-cell span { font-size: 10.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-cell:hover { border-color: var(--sel); }
.pal-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; padding: 0; border-radius: 50%; font-size: 13px; line-height: 1; display: none; }
.pal-cell-wrap:hover .pal-remove { display: block; }
.pal-foot { display: flex; gap: 8px; align-items: center; margin: 12px 0 6px; flex-wrap: wrap; }
/* New / Edit Resource Type dialog */
.sheet h2.dialog-title { margin: -2px -22px 14px; padding: 0 22px 12px; border-bottom: 1px solid var(--border); }
.res-dot.big { width: 34px; height: 34px; }
.icon-colors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.icon-colors.disabled { opacity: .35; pointer-events: none; }
.sheet h3.muted-off { opacity: .45; }
.color-pick { width: 34px; height: 26px; padding: 0 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); cursor: pointer; }

/* the trader's shared middle line */
.node .shape-line { stroke: var(--line); stroke-width: 2; }
.node.selected .shape-line { stroke: var(--sel); stroke-width: 3; }
.node.connect-ok .shape-line { stroke: var(--flow); }

/* pools: chips stacked like poker chips; the number and label take the pool's resource colour */
.chip { stroke-width: 0.8; pointer-events: none; }
.chips { pointer-events: bounding-box; }
.chip-icon { fill: var(--ink); color: var(--ink); --icon-cut: var(--node-fill); pointer-events: none; filter: drop-shadow(0 0 0.6px var(--node-fill)) drop-shadow(0 0 0.6px var(--node-fill)); }
.node-pool.res-colored .value, .node-pool.res-colored .label { fill: var(--res-color); }

/* a token turned away by a pool of another resource type: a quick red flash as it plinks off */
.token.rejected circle:first-child { stroke: var(--bad); stroke-width: 2; }
